name: Release

# Packs the mod into an installable .zip and publishes it as a GitHub Release.
#
# RELEASING IS DELIBERATE. This runs on every push to main, but publishes
# nothing unless manifest.json's version is ahead of every existing vX.Y.Z tag.
# Bumping the version IS the act of releasing. A code fix, a test change or a
# comment tidy pushed without a version bump exits cleanly and publishes
# nothing, so tags and releases stay meaningful and stay immutable.
#
# Override it two ways when you need to:
#   * run it by hand from Actions > Release > Run workflow, with a version
#   * put "[release X.Y.Z]" anywhere in the commit message
#
# Archive layout: every shipped file at the archive root, manifest.json
# included. That is one of the two shapes the game accepts on
# MODS > Import mod .zip (src/mods/LauncherMods.lua locateRoot: manifest at
# the root, or inside a single top-level folder).
#
# The file set honours .modkitignore, exactly as `modkit pack` does, so a
# release built here matches one built locally. Without that this would ship
# the nine test suites and docs/, which modkit deliberately excludes.
#
# NOTE: the test suites cannot run here. They require the Gen1Recomp engine
# (tests.modkit, src.mods.*) which is not part of this repository. Run them
# locally from the engine root before bumping the version.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to release (e.g. 1.0.2). Leave blank to use manifest.json."
        required: false
        default: ""

# Only what publishing a release needs. Not write-all.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        env:
          # Passed through the environment, never interpolated into the script
          # body. A workflow_dispatch input is attacker-controlled text and
          # inlining it as ${{ }} inside run: is a shell injection.
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, sys

          SEMVER = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True).stdout.strip()

          def parse(text):
              m = SEMVER.match(text)
              return tuple(int(p) for p in m.groups()) if m else None

          def die(msg):
              print(f"::error::{msg}", file=sys.stderr)
              raise SystemExit(1)

          with open("manifest.json", encoding="utf-8") as fh:
              manifest_version = str(json.load(fh).get("version", ""))

          released = sorted(
              v for v in (parse(tag[1:]) for tag in sh("git", "tag", "-l", "v*").splitlines()) if v
          )
          latest = released[-1] if released else None

          override = os.environ.get("DISPATCH_VERSION", "").strip()
          if not override:
              found = re.search(r"\[release\s+(\d+\.\d+\.\d+)\]", sh("git", "log", "-1", "--pretty=%B"))
              override = found.group(1) if found else ""

          manifest_ver = parse(manifest_version)

          if override:
              version = parse(override) or die(f"invalid version override {override!r} (expected X.Y.Z)")
              source = "the override"
          elif manifest_ver and (latest is None or manifest_ver > latest):
              version = manifest_ver
              source = "manifest.json"
          else:
              # Nothing to release. This is the ordinary outcome of an ordinary
              # push, not a failure: exit green so the commit is not flagged.
              current = "v%d.%d.%d" % latest if latest else "no tags yet"
              print(f"manifest.json is {manifest_version!r} and the newest tag is "
                    f"{current}. Nothing to release; bump the manifest version to "
                    "publish.", file=sys.stderr)
              print("release=false")
              raise SystemExit(0)

          text = "%d.%d.%d" % version
          print(f"Releasing {text}, from {source}.", file=sys.stderr)
          print("release=true")
          print(f"version={text}")
          print(f"tag=v{text}")
          PY

      - name: Refuse to clobber an existing release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Pick a different version."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Pick a different version."
            exit 1
          fi

      - name: Build the mod .zip
        if: steps.ver.outputs.release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MOD_ID: "career_card"
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/pkg"
          out="$GITHUB_WORKSPACE/dist"
          rm -rf "$staging" "$out"
          mkdir -p "$staging" "$out"

          git archive HEAD | tar -x -C "$staging"

          # Repo plumbing that is never part of a mod.
          rm -rf "$staging/.github" "$staging/.gitattributes" \
                 "$staging/.gitignore" "$staging/.luarc.json"

          # Honour .modkitignore, the same exact-path list `modkit pack` uses,
          # so a release built here is the same file set as one built locally.
          # Read the whole list BEFORE deleting anything: .modkitignore lists
          # itself, so deleting as we read would truncate the loop.
          if [ -f "$staging/.modkitignore" ]; then
            mapfile -t ignored < "$staging/.modkitignore"
            for entry in "${ignored[@]}"; do
              entry="${entry%$'\r'}"
              [ -z "$entry" ] && continue
              case "$entry" in \#*) continue ;; esac
              rm -rf "${staging:?}/$entry"
            done
            rm -f "$staging/.modkitignore"
          fi
          # Directories emptied by the removals above (tests/, docs/).
          find "$staging" -type d -empty -delete

          python3 - "$staging/manifest.json" "$VERSION" <<'PY'
          import json, sys
          path, version = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              manifest = json.load(fh)
          manifest["version"] = version
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          PY

          zip_path="$out/${MOD_ID}-${VERSION}.zip"
          (cd "$staging" && zip -qr "$zip_path" .)
          unzip -l "$zip_path"

          # The archive has to be installable, and has to say what it is. Both
          # are asserted here rather than assumed: a release that fails these
          # never reaches anyone.
          unzip -p "$zip_path" manifest.json > "$RUNNER_TEMP/packed-manifest.json"
          python3 - "$RUNNER_TEMP/packed-manifest.json" "$VERSION" <<'PY'
          import json, sys
          path, expected = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              manifest = json.load(fh)
          if manifest["version"] != expected:
              raise SystemExit(f"::error::packed manifest says {manifest['version']}, expected {expected}")
          if manifest.get("affects_link") is not False:
              raise SystemExit("::error::affects_link is not declared false; an omitted "
                               "value is read as true and blocks link play")
          print(f"manifest.json is at the archive root and reports {manifest['version']}")
          PY

          # No test suite or doc should ever reach a player.
          if unzip -l "$zip_path" | grep -qE ' (tests/|docs/)'; then
            echo "::error::the archive contains tests/ or docs/"
            exit 1
          fi

          (cd "$out" && sha256sum "${MOD_ID}"-*.zip > "${MOD_ID}-${VERSION}.zip.sha256")
          cat "$out/${MOD_ID}-${VERSION}.zip.sha256"

      - name: Publish GitHub Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          MOD_ID: "career_card"
          MOD_NAME: "Career Card"
        run: |
          set -euo pipefail

          prev="$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"
          range="${prev:+${prev}..}$GITHUB_SHA"
          changes="$(git log --no-merges --pretty='- %s' "$range" | head -50 || true)"

          notes="Requires Gen1Recomp. Download ${MOD_ID}-${VERSION}.zip and install it through the launcher, or from the game: MODS > Import mod .zip."
          notes+=$'\n\nVerify your download (optional):\n'
          notes+="  sha256sum -c ${MOD_ID}-${VERSION}.zip.sha256"
          notes+=$'\n\nUnder Gen 1 Modern UI, CAREER appears at START > MOD MENUS > CAREER.'
          if [ -n "$changes" ]; then
            notes+=$'\n\n## Changes\n\n'"$changes"
          fi
          printf 'Release notes:\n%s\n' "$notes"

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$MOD_NAME $VERSION" \
            --notes "$notes" \
            --latest \
            "dist/${MOD_ID}-${VERSION}.zip" \
            "dist/${MOD_ID}-${VERSION}.zip.sha256"

          echo "Published release $TAG"
